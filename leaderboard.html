<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BULK Rank Card Editor</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Terminal Grotesque';
      src: url('https://raw.githubusercontent.com/nftsamuraii/-bulk-pnl-generator/main/assets/terminal-grotesque-webfont.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }
  </style>
  <style>
    :root { --bg:#0a0a0a; --card:#121212; --border:#2a2a2a; --gold:#c8b882; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:#fff; font-family:'IBM Plex Sans',sans-serif; min-height:100vh; padding:20px; }

    .container { max-width:1100px; margin:0 auto; display:flex; gap:30px; flex-wrap:wrap; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; flex:1; min-width:300px; }

    h2 { font-family:'Playfair Display',serif; font-size:14px; letter-spacing:3px; color:var(--gold); margin-bottom:20px; text-transform:uppercase; }

    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; letter-spacing:2px; color:#888; text-transform:uppercase; margin-bottom:8px; }
    .field input { width:100%; background:#1e1e1e; border:1px solid var(--border); border-radius:8px; color:#fff; font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:12px 14px; outline:none; transition:border-color 0.2s; }
    .field input:focus { border-color:var(--gold); }

    .fields-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .fields-grid .field { margin-bottom:0; }

    .bg-select { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .bg-thumb { width:70px; height:70px; border-radius:8px; border:2px solid var(--border); cursor:pointer; transition:all 0.2s; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:10px; color:#888; text-align:center; overflow:hidden; }
    .bg-thumb:hover { border-color:var(--gold); }
    .bg-thumb.selected { border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,184,130,0.3); }
    .bg-thumb img { width:100%; height:100%; object-fit:cover; border-radius:6px; }

    .color-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px; }
    .swatch { width:30px; height:30px; border-radius:6px; border:2px solid #333; cursor:pointer; transition:border-color 0.15s; }
    .swatch.active { border-color:var(--gold); }

    .preview-wrap { display:flex; flex-direction:column; align-items:center; }
    .preview-empty { width:100%; max-width:380px; height:440px; background:#1a1a1a; border:2px dashed var(--border); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#555; font-size:13px; text-align:center; gap:12px; }
    .preview-empty .icon { font-size:48px; opacity:0.4; }
    #rankCanvas { max-width:100%; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.5); display:none; }

    .btn-generate { width:100%; padding:14px; margin-top:20px; background:linear-gradient(135deg,#c8b882 0%,#a89862 100%); border:none; border-radius:8px; color:#0a0a0a; font-family:'Playfair Display',serif; font-size:16px; font-weight:600; letter-spacing:3px; cursor:pointer; transition:all 0.2s; }
    .btn-generate:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(200,184,130,0.3); }

    .btn-action { width:100%; padding:12px; margin-top:10px; background:transparent; border:1px solid var(--gold); border-radius:8px; color:var(--gold); font-family:'Playfair Display',serif; font-size:14px; letter-spacing:2px; cursor:pointer; opacity:0; pointer-events:none; transition:all 0.2s; }
    .btn-action.visible { opacity:1; pointer-events:auto; }
    .btn-action:hover { background:rgba(200,184,130,0.08); }

    .info-box { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:12px 14px; margin-bottom:20px; font-size:12px; color:#555; line-height:1.7; }
    .info-box b { color:#888; }

    .section-label { font-size:11px; letter-spacing:2px; color:#888; text-transform:uppercase; margin-bottom:10px; display:block; }
  </style>
</head>
<body>

  <header style="max-width:1100px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;padding:20px 0;">
    <img src="https://raw.githubusercontent.com/nftsamuraii/-bulk-pnl-generator/main/assets/BULKPNLCARD.png" alt="BULK" style="height:38px;">
  </header>

  <div class="container">

    <!-- LEFT: Controls -->
    <div class="panel">

      <h2>Background</h2>
      <div class="info-box">
        <b>How it works:</b> Choose a background, enter your stats, hit Generate. Text is drawn cleanly on a fresh background — no overlap, no issues.
      </div>

      <span class="section-label">Choose Background</span>
      <div class="bg-select" id="bgSelect"></div>

      <h2>Stats</h2>

      <div class="field">
        <label># Global Rank</label>
        <input type="text" id="rankNum" placeholder="#1" value="#1">
      </div>

      <div class="fields-grid">
        <div class="field">
          <label>Cashflow ROI</label>
          <input type="text" id="rankRoi" placeholder="+39.6%" value="+39.6%">
        </div>
        <div class="field">
          <label>Net Realized PnL</label>
          <input type="text" id="rankPnl" placeholder="$3.96K" value="$3.96K">
        </div>
        <div class="field">
          <label>Total Volume</label>
          <input type="text" id="rankVol" placeholder="$1.13M" value="$1.13M">
        </div>
        <div class="field">
          <label>Win Rate</label>
          <input type="text" id="rankWin" placeholder="100%" value="100%">
        </div>
      </div>

      <div class="field" style="margin-top:12px;">
        <label>Value Color</label>
        <div class="color-row">
          <div class="swatch active" id="sw0" style="background:#F5A623;" onclick="setAccent('#F5A623',0)" title="Gold (original)"></div>
          <div class="swatch" id="sw1" style="background:#00e8a2;" onclick="setAccent('#00e8a2',1)"></div>
          <div class="swatch" id="sw2" style="background:#ff4060;" onclick="setAccent('#ff4060',2)"></div>
          <div class="swatch" id="sw3" style="background:#7B8CFF;" onclick="setAccent('#7B8CFF',3)"></div>
          <div class="swatch" id="sw4" style="background:#ffffff;" onclick="setAccent('#ffffff',4)"></div>
          <input type="color" id="customColor" value="#F5A623" oninput="setAccentCustom(this.value)" style="width:30px;height:30px;border:none;border-radius:6px;cursor:pointer;padding:0;" title="Custom">
          <span style="font-size:11px;color:#444;letter-spacing:1px;">custom</span>
        </div>
      </div>

    </div>

    <!-- RIGHT: Preview -->
    <div class="panel preview-wrap">
      <h2>Preview</h2>

      <div class="preview-empty" id="emptyState">
        <span class="icon">🏆</span>
        <span>Choose a background<br>and hit Generate</span>
      </div>

      <canvas id="rankCanvas"></canvas>

      <button class="btn-generate" onclick="generateCard()">GENERATE</button>
      <button class="btn-action" id="btnDownload" onclick="downloadCard()">⬇ DOWNLOAD</button>
      <button class="btn-action" id="btnCopy" onclick="copyCard()">📋 COPY</button>
    </div>

  </div>

const backgrounds = [
  { label: 'Cave Man', url: BG_DEFAULT },
];

let selectedBgUrl = BG_DEFAULT;
let accentColor = '#F5A623';

// ── Render background thumbnails ─────────────────────────────
function renderBgThumbs() {
  const grid = document.getElementById('bgSelect');
  grid.innerHTML = '';
  backgrounds.forEach((bg, idx) => {
    const div = document.createElement('div');
    div.className = 'bg-thumb' + (idx === 0 ? ' selected' : '');
    div.title = bg.label;
    div.onclick = () => selectBg(bg.url, div);
    const img = document.createElement('img');
    img.src = bg.url;
    img.alt = bg.label;
    img.onerror = () => { div.style.background = '#1e1e1e'; div.innerHTML = bg.label; };
    div.appendChild(img);
    grid.appendChild(div);
  });

  // Custom upload option
  const uploadDiv = document.createElement('label');
  uploadDiv.className = 'bg-thumb';
  uploadDiv.title = 'Upload custom background';
  uploadDiv.style.background = '#1a1a1a';
  uploadDiv.innerHTML = '📁<br><span style="font-size:9px">Upload</span>';
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      selectedBgUrl = ev.target.result;
      document.querySelectorAll('.bg-thumb').forEach(el => el.classList.remove('selected'));
      uploadDiv.classList.add('selected');
      uploadDiv.style.backgroundImage = `url(${ev.target.result})`;
      uploadDiv.style.backgroundSize = 'cover';
      uploadDiv.innerHTML = '';
    };
    reader.readAsDataURL(file);
  };
  uploadDiv.appendChild(inp);
  grid.appendChild(uploadDiv);
}

function selectBg(url, el) {
  selectedBgUrl = url;
  document.querySelectorAll('.bg-thumb').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

// ── Color swatches ───────────────────────────────────────────
function setAccent(color, idx) {
  accentColor = color;
  for (let i = 0; i < 5; i++) {
    const sw = document.getElementById('sw' + i);
    if (sw) sw.classList.toggle('active', i === idx);
  }
}
function setAccentCustom(color) {
  accentColor = color;
  for (let i = 0; i < 5; i++) {
    const sw = document.getElementById('sw' + i);
    if (sw) sw.classList.remove('active');
  }
}

async function generateCard() {
  // Preload fonts
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('400 72px "Terminal Grotesque"'),
        document.fonts.load('400 18px "IBM Plex Sans"'),
      ]),
      new Promise((_, r) => setTimeout(r, 3000))
    ]);
  } catch(e) {}

  const rankNum = document.getElementById('rankNum').value || '#1';
  const roi     = document.getElementById('rankRoi').value || '+0%';
  const pnl     = document.getElementById('rankPnl').value || '$0';
  const vol     = document.getElementById('rankVol').value || '$0';
  const win     = document.getElementById('rankWin').value || '0%';

  const canvas = document.getElementById('rankCanvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';

  img.onload = () => {
    const W = img.naturalWidth;
    const H = img.naturalHeight;
    canvas.width = W;
    canvas.height = H;

    // Draw clean background — no original text to worry about
    ctx.drawImage(img, 0, 0, W, H);

    // ── Layout: measured from 762×824 clean BULK leaderboard card ──
    // All text right-aligned to TX
    const TX = Math.round(W * 0.952);

    // Font sizes relative to card height
    const RANK_FS  = Math.round(H * 0.110);  // big rank number
    const VAL_FS   = Math.round(H * 0.058);  // stats values
    const LABEL_FS = Math.round(H * 0.0235); // labels

    // Measured Y baselines from clean card analysis:
    // Labels:  Your Global Rank=0.229, ROI=0.431, PnL=0.550, Vol=0.674, WinRate=0.797
    // Values:  Rank≈0.320, ROI≈0.453 (dash), PnL≈0.618, Vol≈0.743, WinRate≈0.862
    const rows = [
      {
        labelText: 'Your Global Rank',
        labelY: H * 0.228,
        value:  rankNum,
        valueY: H * 0.335,
        valFS:  RANK_FS,
      },
      {
        labelText: 'Cashflow Adjusted ROI',
        labelY: H * 0.431,
        value:  roi,
        valueY: H * 0.500,
        valFS:  VAL_FS,
      },
      {
        labelText: 'Net Realized PnL',
        labelY: H * 0.550,
        value:  pnl,
        valueY: H * 0.618,
        valFS:  VAL_FS,
      },
      {
        labelText: 'Total Vol',
        labelY: H * 0.674,
        value:  vol,
        valueY: H * 0.743,
        valFS:  VAL_FS,
      },
      {
        labelText: 'Win Rate',
        labelY: H * 0.797,
        value:  win,
        valueY: H * 0.862,
        valFS:  VAL_FS,
      },
    ];

    rows.forEach(row => {
      // Label — IBM Plex Sans, white 62%, right-aligned
      ctx.save();
      ctx.textAlign = 'right';
      ctx.font = `400 ${LABEL_FS}px 'IBM Plex Sans', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.fillText(row.labelText, TX, row.labelY);
      ctx.restore();

      // Value — Terminal Grotesque, accent color, right-aligned
      ctx.save();
      ctx.textAlign = 'right';
      ctx.font = `400 ${row.valFS}px 'Terminal Grotesque', 'Share Tech Mono', monospace`;
      ctx.fillStyle = accentColor;
      ctx.fillText(row.value, TX, row.valueY);
      ctx.restore();
    });

    document.getElementById('emptyState').style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('btnDownload').classList.add('visible');
    document.getElementById('btnCopy').classList.add('visible');
  };

  img.onerror = () => alert('Could not load background. Check your connection.');
  img.src = selectedBgUrl;
}

// ── Download ─────────────────────────────────────────────────
function downloadCard() {
  const canvas = document.getElementById('rankCanvas');
  const btn = document.getElementById('btnDownload');
  const orig = btn.innerHTML;
  btn.innerHTML = '⏳ Saving...';
  try {
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = 'bulk-rank-card.png';
    a.href = dataUrl;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => { btn.innerHTML = orig; }, 800);
  } catch(e) {
    btn.innerHTML = orig;
    // Fallback: open in new tab
    try { window.open(canvas.toDataURL('image/png'), '_blank'); }
    catch(e2) { alert('Right-click on the image → Save image as...'); }
  }
}

// ── Copy ──────────────────────────────────────────────────────
async function copyCard() {
  const canvas = document.getElementById('rankCanvas');
  const btn = document.getElementById('btnCopy');
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    btn.innerHTML = '✓ COPIED!';
    setTimeout(() => { btn.innerHTML = '📋 COPY'; }, 2000);
  } catch(e) {
    try { window.open(canvas.toDataURL('image/png'), '_blank'); }
    catch(e2) { alert('Could not copy. Try Download instead.'); }
  }
}

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  renderBgThumbs();
});
</script>
